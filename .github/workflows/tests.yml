name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, zlib, gmp
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Syntax check
        run: |
          find src examples tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Offline tests (HPACK and validation)
        run: php tests/run.php --offline

      - name: Full tests (TLS and HTTP)
        run: php tests/run.php
